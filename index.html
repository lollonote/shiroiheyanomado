<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>デジタル小説</title>
<style>
body {
    margin: 0;
    background: #222;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Yu Mincho", "游明朝", serif;
    user-select: none;
}

/* 本全体 */
.book {
    width: 944px;
    height: 700px;
    display: flex;
    background: #fffdf5;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
}

/* ページ基盤 */
.page {
    width: 50%;
    height: 100%;
    padding: 60px 60px 90px 60px;
    box-sizing: border-box;
    overflow: hidden;
    background: linear-gradient(90deg, #fffdf5, #fffaf0);
    position: relative;
}

/* 【重要変更】1ページの中に16本の独立した「行」の並びを作るコンテナ */
.page-content {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: row-reverse; /* 右から左へ行を並べる */
    justify-content: flex-start;
}

/* 【超重要】1行ごとの絶対サイズ設定 */
.line {
    width: 22px;               /* 行送り22px（文字14px × 約1.57）＝ 実際の文庫本に近い比率 */
    height: 550px;
    font-size: 14px;
    line-height: 22px;         /* 行の中央に文字が来るよう行送りと同じ値に */
    writing-mode: vertical-rl; /* 縦書き */
    text-orientation: mixed;
    white-space: nowrap;       /* この箱の中で自動折り返しさせない */
    overflow: hidden;
    text-align: start;
}

/* 左ページ */
.left {
    border-right: 2px solid #ddd;
    box-shadow: inset -20px 0 30px rgba(0,0,0,.08);
}

/* 右ページ */
.right {
    box-shadow: inset 20px 0 30px rgba(0,0,0,.08);
}

/* ページ数（ノンブル）のスタイル */
.page-number {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #888;
    font-family: sans-serif;
}

/* 操作ボタン */
.controls {
    position: fixed;
    bottom: 30px;
}

button {
    padding: 12px 30px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    border: 1px solid #777;
    background: #fff;
}

button:hover {
    background: #eee;
}
</style>
</head>
<body>

<div class="book">
    <div class="page left">
        <div id="left-content" class="page-content"></div>
        <div class="page-number" id="left-num"></div>
    </div>
    <div class="page right">
        <div id="right-content" class="page-content"></div>
        <div class="page-number" id="right-num"></div>
    </div>
</div>

<div class="controls">
    <button onclick="next()">← 進む</button>
    <button onclick="back()">戻る →</button>
</div>

let pages = []; // ページごとの「行（文字列）の配列」を格納する2次元配列
let current = 0;

function createPages() {
    pages = [];
    
    // 1. 本文を「●の行」と「それ以外の通常の塊」に分解
    const lines = novel.split('\n');
    let cleanChunks = [];
    let currentNormalText = "";
    
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line === "") continue; 
        
        if (line.includes("●")) {
            if (currentNormalText) {
                cleanChunks.push({ type: "normal", text: currentNormalText });
                currentNormalText = "";
            }
            cleanChunks.push({ type: "title", text: line });
        } else {
            currentNormalText += line.replace(/\s+/g, "");
        }
    }
    if (currentNormalText) {
        cleanChunks.push({ type: "normal", text: currentNormalText });
    }

    // 2. 「1行＝38文字」「1ページ＝16行」（文庫本に近い組版）
    let currentPageLines = [];
    const maxCharsPerLine = 38;
    const maxLinesPerPage = 16;

    for (let chunk of cleanChunks) {
        if (chunk.type === "title") {
            if (currentPageLines.length >= maxLinesPerPage) {
                pages.push(currentPageLines);
                currentPageLines = [];
            }
            currentPageLines.push(chunk.text);
            if (currentPageLines.length < maxLinesPerPage) {
                currentPageLines.push(""); // タイトルの後ろに1行あける
            }
        } else {
            const wrapped = wrapWithKinsoku(chunk.text, maxCharsPerLine);
            for (const lineText of wrapped) {
                if (currentPageLines.length >= maxLinesPerPage) {
                    pages.push(currentPageLines);
                    currentPageLines = [];
                }
                currentPageLines.push(lineText);
            }
        }
    }

    if (currentPageLines.length > 0) {
        pages.push(currentPageLines);
    }
}

const NO_LINE_START = "。、，．,.）」』】〉》〕］｝！？!?・：；ー～…‥ゝゞぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ"; // 行頭禁止
const NO_LINE_END   = "（「『【〈《〔［｛";                                                                  // 行末禁止
const HANGING       = "。、，．";                                                                           // ぶら下げ可（行末にはみ出して置ける）
const NO_SPLIT      = "…―‥";                                                                               // 連続する場合は分割禁止

function wrapWithKinsoku(text, max) {
    const result = [];
    let pos = 0;
    while (pos < text.length) {
        let end = Math.min(pos + max, text.length);
        if (end < text.length) {
            // ぶら下げ：次の文字が句読点なら、今の行の末尾にはみ出して置く（最大1文字）
            if (HANGING.includes(text[end])) {
                end++;
            }
            // 追い出し：行頭禁止／行末禁止／分割禁止にぶつかる間は、行末の文字を次の行へ送る
            while (end - pos > 1 && end < text.length && (
                NO_LINE_START.includes(text[end]) ||
                NO_LINE_END.includes(text[end - 1]) ||
                (NO_SPLIT.includes(text[end]) && text[end] === text[end - 1])
            )) {
                end--;
            }
        }
        result.push(text.substring(pos, end));
        pos = end;
    }
    return result;
}

// ページ内容を描画する関数
function renderPageSpace(elementId, linesArray) {
    const container = document.getElementById(elementId);
    container.innerHTML = ""; // 一度リセット
    
    if (!linesArray) return;

    // 16本の物理的な「行用の箱」を作って文字を流し込む
    for (let i = 0; i < linesArray.length; i++) {
        const lineDiv = document.createElement('div');
        lineDiv.className = 'line';
        lineDiv.textContent = linesArray[i];
        container.appendChild(lineDiv);
    }
}

function show() {
    const rightIndex = current * 2;
    const leftIndex = current * 2 + 1;

    // 右ページと左ページにそれぞれの行配列を流し込む
    renderPageSpace("right-content", pages[rightIndex]);
    renderPageSpace("left-content", pages[leftIndex]);

    const rightNumEl = document.getElementById("right-num");
    const leftNumEl = document.getElementById("left-num");

    rightNumEl.textContent = (pages[rightIndex] !== undefined) ? (rightIndex + 1) : "";
    leftNumEl.textContent = (pages[leftIndex] !== undefined) ? (leftIndex + 1) : "";
}

function next() {
    if (current < Math.ceil(pages.length / 2) - 1) {
        current++;
        show();
    }
}

function back() {
    if (current > 0) {
        current--;
        show();
    }
}

// 初期化

show();
